<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Volee Admin</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="signin" class="signin hidden">
  <form id="signin-form" class="card narrow">
    <div class="brand"><span class="ball"></span> Volee <b>Admin</b></div>
    <label>Email<input id="login" type="email" autocomplete="username" required></label>
    <label>Password<input id="password" type="password" autocomplete="current-password" required></label>
    <button type="submit" class="primary">Sign in</button>
    <p id="signin-error" class="error"></p>
    <p class="muted small">Only Volee admins can see anything here.</p>
  </form>
</div>

<div id="app" class="hidden">
  <header>
    <div class="brand"><span class="ball"></span> Volee <b>Admin</b></div>
    <nav>
      <button data-tab="dashboard" class="active">Dashboard</button>
      <button data-tab="seasons">Seasons</button>
      <button data-tab="players">Players</button>
      <button data-tab="safety">Safety</button>
      <button data-tab="settings">Settings</button>
    </nav>
    <div class="who"><span id="who"></span><button id="signout" class="link">Sign out</button></div>
  </header>

  <main>
    <section id="tab-dashboard"></section>
    <section id="tab-seasons" class="hidden"></section>
    <section id="tab-players" class="hidden">
      <div class="card">
        <input id="player-q" placeholder="Search by name, username or email" autocomplete="off">
      </div>
      <div id="player-results"></div>
      <div id="player-detail"></div>
    </section>
    <section id="tab-safety" class="hidden"></section>
    <section id="tab-settings" class="hidden"></section>
  </main>
  <div id="toast" class="toast hidden"></div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
